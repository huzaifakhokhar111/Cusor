name: Build GlideCursor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip or handle nested folder
        run: |
          if [ -f "GlideCursor.zip" ]; then
            echo "Unzipping GlideCursor.zip..."
            unzip -o GlideCursor.zip
          fi
          if [ -d "GlideCursor" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Moving files from GlideCursor subfolder..."
            cp -r GlideCursor/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Make gradlew executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlideCursor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
