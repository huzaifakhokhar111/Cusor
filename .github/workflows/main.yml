name: Build GlideCursor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare Project and Fix Android Resources
        run: |
          # 1. Agar subfolder mein hai tou root par move karein
          if [ -d "GlideCursor" ] && [ ! -f "build.gradle.kts" ]; then
            echo "Moving files from GlideCursor subfolder..."
            cp -r GlideCursor/* .
          fi

          # 2. Android SDK licenses accept karein
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true

          # 3. App icon auto-generate karein (AAPT2 private icon error fix)
          RES_DIR=$(find . -type d -path "*/app/src/main/res" | head -n 1)
          if [ -n "$RES_DIR" ]; then
            mkdir -p "$RES_DIR/drawable"
            cat << 'EOF' > "$RES_DIR/drawable/ic_launcher.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#070A13"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M50,20h8v68h-8z" />
          </vector>
          EOF
            find . -name "AndroidManifest.xml" -exec sed -i 's|@android:drawable/sym_def_app_icon|@drawable/ic_launcher|g' {} +
          fi

          # 4. Android SDK path configure karein
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlideCursor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
