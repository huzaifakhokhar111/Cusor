name: Build GlideCursor Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Prepare and Compile APK
        run: |
          set -e
          echo "=== 1. Unpacking Project ==="
          if [ -f "GlideCursor.zip" ]; then
            unzip -o GlideCursor.zip
          fi
          if [ -d "GlideCursor" ] && [ ! -f "build.gradle.kts" ]; then
            cp -rn GlideCursor/* . || true
          fi

          echo "=== 2. Creating Proguard and Icon Assets ==="
          mkdir -p app/src/main/res/drawable
          touch app/proguard-rules.pro
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#070A13" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#38BDF8" android:pathData="M50,20h8v68h-8z" />
          </vector>
          EOF
          find . -name "AndroidManifest.xml" -exec sed -i 's|@android:drawable/sym_def_app_icon|@drawable/ic_launcher|g' {} +

          echo "=== 3. Setting SDK Directory ==="
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "=== 4. Compiling APK ==="
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlideCursor-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
